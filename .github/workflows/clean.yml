name: encoding-check  
  
on:  
  push:  
  pull_request:  
  workflow_dispatch:  
  
jobs:  
  check-and-fix-encoding:  
    runs-on: ubuntu-latest  
    steps:  
      - uses: actions/checkout@v4  
  
      - name: 严格校验 UTF-8 并将 Shift-JIS(CP932) 源文件无损转码为 UTF-8，消除 0x5C 截断与 C4828  
        run: sudo apt-get update -y && sudo apt-get install -y iconv file >/dev/null 2>&1; find . -path ./.git -prune -o -path ./.github -prune -o -type f \( -iname "*.c" -o -iname "*.cc" -o -iname "*.cpp" -o -iname "*.cxx" -o -iname "*.h" -o -iname "*.hh" -o -iname "*.hpp" -o -iname "*.hxx" -o -iname "*.inc" -o -iname "*.mcr" \) -print0 | xargs -0 -I{} sh -c 'iconv -f UTF-8 -t UTF-8 "{}" -o /dev/null 2>/dev/null && exit 0; iconv -f CP932 -t UTF-8//TRANSLIT "{}" -o "{}.utf8tmp" 2>/dev/null && mv "{}.utf8tmp" "{}" && echo "[FIXED] {} : CP932 -> UTF-8" || echo "[ERROR] {} : 既非合规UTF-8也无法按CP932解码，请人工检查"'  
  
      - name: 再次严格校验，确认不存在任何非法 UTF-8 字节序列（即 C4828 根源已清除）  
        run: find . -path ./.git -prune -o -path ./.github -prune -o -type f \( -iname "*.c" -o -iname "*.cc" -o -iname "*.cpp" -o -iname "*.cxx" -o -iname "*.h" -o -iname "*.hh" -o -iname "*.hpp" -o -iname "*.hxx" -o -iname "*.inc" -o -iname "*.mcr" \) -print0 | xargs -0 -I{} sh -c 'iconv -f UTF-8 -t UTF-8 "{}" -o /dev/null 2>/dev/null || { echo "::error file={}::仍存在非合规 UTF-8 字节，转码失败"; exit 1; }'  
  
      - name: 自动提交转码结果  
        uses: stefanzweifel/git-auto-commit-action@v5  
        with:  
          commit_message: "chore: 自动将 Shift-JIS/CP932 源文件无损转换为 UTF-8，消除 C4828"  
          file_pattern: "*.c *.cc *.cpp *.cxx *.h *.hh *.hpp *.hxx *.inc *.mcr"
